<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卧推增力计划</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #1a1a1a;
  color: #f0f0f0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
  padding: 24px 16px;
}

#app {
  max-width: 1100px;
  margin: 0 auto;
}

h1 {
  text-align: center;
  font-size: 1.8rem;
  color: #f5a623;
  margin-bottom: 24px;
  letter-spacing: 0.05em;
}

.input-section {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 32px;
  flex-wrap: wrap;
}

.input-section label {
  font-size: 1rem;
  color: #ccc;
}

.input-section input {
  width: 100px;
  padding: 8px 12px;
  font-size: 1.1rem;
  background: #2a2a2a;
  border: 2px solid #444;
  border-radius: 8px;
  color: #f0f0f0;
  text-align: center;
  outline: none;
  transition: border-color 0.2s;
}

.input-section input:focus {
  border-color: #f5a623;
}

.input-section .unit {
  color: #aaa;
  font-size: 0.95rem;
}

button.calc-btn {
  padding: 8px 20px;
  background: #f5a623;
  color: #1a1a1a;
  font-size: 1rem;
  font-weight: 700;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.2s;
}

button.calc-btn:hover {
  background: #e09510;
}

.cards-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 32px;
}

@media (max-width: 800px) {
  .cards-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 480px) {
  .cards-grid {
    grid-template-columns: 1fr;
  }
}

.card {
  background: #242424;
  border: 1px solid #333;
  border-radius: 12px;
  overflow: hidden;
}

.card-header {
  background: #f5a623;
  color: #1a1a1a;
  text-align: center;
  padding: 10px;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.05em;
}

.card table {
  width: 100%;
  border-collapse: collapse;
}

.card table th {
  background: #2e2e2e;
  color: #aaa;
  font-size: 0.75rem;
  padding: 6px 8px;
  text-align: center;
  border-bottom: 1px solid #333;
}

.card table td {
  padding: 8px;
  text-align: center;
  font-size: 0.9rem;
  border-bottom: 1px solid #2e2e2e;
}

.card table tr:last-child td {
  border-bottom: none;
}

.card table tr:nth-child(even) td {
  background: #272727;
}

.weight-cell {
  color: #f5a623;
  font-weight: 700;
  font-size: 1rem;
}

.save-section {
  text-align: center;
}

button.save-btn {
  padding: 12px 36px;
  background: #2a2a2a;
  color: #f5a623;
  font-size: 1rem;
  font-weight: 700;
  border: 2px solid #f5a623;
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}

button.save-btn:hover {
  background: #f5a623;
  color: #1a1a1a;
}

button.save-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
  </style>
</head>
<body>
  <div id="app">
    <h1>卧推增力计划</h1>

    <div class="input-section">
      <label for="maxWeight">最大重量</label>
      <input type="number" id="maxWeight" value="95" min="1" max="500" step="0.5">
      <span class="unit">kg</span>
      <button class="calc-btn" onclick="calculate()">计算</button>
    </div>

    <div class="cards-grid" id="cardsGrid">
      <!-- 由 JS 动态生成 -->
    </div>

    <div class="save-section">
      <button class="save-btn" onclick="saveImage()">保存图片</button>
    </div>
  </div>
  <script>
    const LEVELS = [
  {
    name: '级别一',
    sets: [
      { ratio: 0.50, reps: '10' },
      { ratio: 0.70, reps: '5' },
      { ratio: 0.85, reps: '3' },
      { ratio: 0.85, reps: '5' },
      { ratio: 0.70, reps: '10' },
      { ratio: 0.60, reps: '10' },
    ]
  },
  {
    name: '级别二',
    sets: [
      { ratio: 0.50, reps: '10' },
      { ratio: 0.75, reps: '5' },
      { ratio: 0.85, reps: '3' },
      { ratio: 0.90, reps: '2~3' },
      { ratio: 0.85, reps: '5' },
      { ratio: 0.80, reps: '7' },
    ]
  },
  {
    name: '级别三',
    sets: [
      { ratio: 0.50, reps: '10' },
      { ratio: 0.65, reps: '7' },
      { ratio: 0.75, reps: '5' },
      { ratio: 0.85, reps: '3' },
      { ratio: 1.00, reps: '1~2' },
      { ratio: 0.85, reps: '5' },
    ]
  },
  {
    name: '级别四',
    sets: [
      { ratio: 0.50, reps: '10' },
      { ratio: 0.70, reps: '5' },
      { ratio: 0.85, reps: '2' },
      { ratio: 1.05, reps: '1~2' },
      { ratio: 1.00, reps: '1' },
      { ratio: 0.85, reps: '5' },
    ]
  }
];

function formatWeight(w) {
  const rounded = Math.round(w * 10) / 10;
  return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
}

function calculate() {
  const maxWeight = parseFloat(document.getElementById('maxWeight').value);
  if (!maxWeight || maxWeight <= 0) return;

  const grid = document.getElementById('cardsGrid');
  grid.innerHTML = '';

  LEVELS.forEach(level => {
    const card = document.createElement('div');
    card.className = 'card';

    const rows = level.sets.map((s, i) => {
      const weight = s.ratio * maxWeight;
      return `
        <tr>
          <td>${i + 1}</td>
          <td class="weight-cell">${formatWeight(weight)} kg</td>
          <td>${s.reps}</td>
        </tr>`;
    }).join('');

    card.innerHTML = `
      <div class="card-header">${level.name}</div>
      <table>
        <thead>
          <tr>
            <th>组</th>
            <th>重量</th>
            <th>次数</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;

    grid.appendChild(card);
  });
}

function saveImage() {
  const btn = document.querySelector('.save-btn');
  const grid = document.getElementById('cardsGrid');
  const maxWeight = document.getElementById('maxWeight').value;

  btn.disabled = true;
  btn.textContent = '保存中...';

  html2canvas(grid, {
    backgroundColor: '#1a1a1a',
    scale: 2,
  }).then(canvas => {
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = `benchpress-${maxWeight}kg.png`;
    a.click();
  }).finally(() => {
    btn.disabled = false;
    btn.textContent = '保存图片';
  });
}

document.getElementById('maxWeight').addEventListener('keydown', e => {
  if (e.key === 'Enter') calculate();
});

calculate();
  </script>
</body>
</html>
